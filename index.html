<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SocialAlive</title>

  <script>
    (function () {
      var STORAGE_KEY = "sl-theme";
      try {
        var stored = window.localStorage.getItem(STORAGE_KEY);
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>

  <link rel="stylesheet" href="css/base/reset.css" />
  <link rel="stylesheet" href="css/tokens/colors.css" />
  <link rel="stylesheet" href="css/tokens/spacing.css" />
  <link rel="stylesheet" href="css/tokens/typography.css" />
  <link rel="stylesheet" href="css/tokens/radius.css" />
  <link rel="stylesheet" href="css/tokens/shadows.css" />
  <link rel="stylesheet" href="css/tokens/motion.css" />
  <link rel="stylesheet" href="css/themes/theme-light.css" />
  <link rel="stylesheet" href="css/themes/theme-dark.css" />
  <link rel="stylesheet" href="css/base/global.css" />

  <link rel="stylesheet" href="css/components/button.css" />

  <link rel="stylesheet" href="css/components/badge.css" />

  <link rel="stylesheet" href="css/components/theme-switch.css" />

  <link rel="stylesheet" href="css/components/sidebar.css" />

</head>
<body>
  <main id="app-root"></main>

  <!--
    Client Supabase vendorizzato (Fase Auth Supabase, nuovo): SCRIPT
    CLASSICO, senza type="module" e SENZA defer/async, posizionato PRIMA
    del modulo di bootstrap sotto — esegue in modo sincrono nel punto in
    cui il parser lo incontra, mentre un <script type="module"> esegue
    sempre dopo la fine del parsing del documento (per specifica). Al
    momento in cui il modulo sotto viene valutato, "window.supabase" è
    quindi già garantito presente — vedi il commento di testa a
    js/vendor/supabase-js.umd.js per il rationale completo (perché
    vendorizzato e non caricato da CDN, perché UMD e non il build ESM).
  -->
  <script src="js/vendor/supabase-js.umd.js"></script>

  <script type="module">
    import { initTheme } from "./js/services/themeService.js";
    import { initSession } from "./js/services/authService.js";
    import { init as initRouter, registerRoute } from "./js/core/router.js";
    import { createLoginPageController } from "./js/pages/loginPageController.js";
    import { createHomePageController } from "./js/pages/homePageController.js";
    import { createScenarioPageController } from "./js/pages/scenarioPageController.js";
    import { createModuleScenariosPageController } from "./js/pages/moduleScenariosPageController.js";
    import { registerRenderer } from "./js/scenarios/scenarioEngine.js";
    import { renderProfileTimeline } from "./js/scenarios/renderers/profileTimelineRenderer.js";
    import { renderFakeLoginCapture } from "./js/scenarios/renderers/fakeLoginCaptureRenderer.js";

    initTheme();

    registerRenderer("profile-timeline", renderProfileTimeline);
    registerRenderer("fake-login-capture", renderFakeLoginCapture);

    registerRoute("#/login", createLoginPageController, { protected: false, title: "Accedi" });
    registerRoute("#/home", createHomePageController, { protected: true, title: "Home" });
    registerRoute("#/modules/:moduleId", createModuleScenariosPageController, {
      protected: true,
      title: "Scenari",
    });
    registerRoute("#/scenario/:scenarioId", createScenarioPageController, {
      protected: true,
      title: "Scenario",
    });

    // Unico punto asincrono introdotto dalla migrazione a Supabase Auth
    // (vedi rationale completo in authService.js): DEVE risolvere PRIMA
    // di initRouter(), altrimenti la primissima resolve() del router
    // (innescata subito dopo, per l'hash iniziale) osserverebbe una
    // cache di sessione ancora vuota e redirigerebbe erroneamente a
    // #/login anche per un docente già autenticato. "await" di livello
    // top qui è nativamente supportato dagli script type="module".
    await initSession();

    initRouter(document.getElementById("app-root"));
  </script>
</body>
</html>
