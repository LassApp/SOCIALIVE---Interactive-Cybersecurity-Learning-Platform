<!--
  ai.svg
  Icona dell'area "AI": tre scintille (il simbolo più riconoscibile
  dell'intelligenza artificiale generativa): una grande in outline, due
  piccole piene — a 24px il tratto da 1.5px riempirebbe da solo le
  scintille piccole, rendendole macchie. Griglia 24px.

  Il colore (#000) è solo un segnaposto: il file viene usato come
  maschera CSS (mask-image, vedi css/components/area-card.css), quindi
  conta soltanto la forma (canale alfa) — il colore reale arriva da
  currentColor e segue il tema Light/Dark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <path d="M10 4.5 11.6 9.4 16.5 11 11.6 12.6 10 17.5 8.4 12.6 3.5 11 8.4 9.4 10 4.5Z"/>
  <path fill="#000" stroke-width="1" d="M18.5 2.8 19.2 4.8 21.2 5.5 19.2 6.2 18.5 8.2 17.8 6.2 15.8 5.5 17.8 4.8 18.5 2.8Z"/>
  <path fill="#000" stroke-width="1" d="M17.5 14.8 18.1 16.6 19.9 17.2 18.1 17.8 17.5 19.6 16.9 17.8 15.1 17.2 16.9 16.6 17.5 14.8Z"/>
</svg>
